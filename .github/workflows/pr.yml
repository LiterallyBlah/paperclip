name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci'
    # Fork (LiterallyBlah/paperclip): run the trusted CI from this same commit,
    # so the CI matches the tree under test instead of upstream master.
    # The fork has no AWS runner group; ci-routing falls back to ubuntu-latest.
    uses: ./.github/workflows/pr-trusted.yml
